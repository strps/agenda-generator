name: Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/agenda-gui.spec
      - name: Self-test the built exe (fonts, icons, holiday translations, export, GUI)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/AgendaGenerator.exe -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path self-test.log) { Get-Content self-test.log }
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: AgendaGenerator-windows
          path: dist/AgendaGenerator.exe
