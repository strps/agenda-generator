[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-gen"
version = "0.1.0"
description = "Printable agenda/planner PDF generator"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "holidays>=0.50",
    "pypdf>=4.0",
    "qrcode>=7.4",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pypdfium2>=4.30"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
agenda-gen = "agenda.__main__:main"
agenda-gui = "agenda.gui.app:main"

[tool.setuptools.packages.find]
include = ["agenda*"]

[tool.setuptools.package-data]
"agenda.gui" = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
